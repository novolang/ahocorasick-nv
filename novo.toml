[package]
name        = "ahocorasick-nv"
version     = "0.1.0"
description = "Multi-pattern search with an Aho-Corasick automaton built once as a value: standard, leftmost-first and leftmost-longest semantics chosen at construction, overlapping and non-overlapping iteration, streaming over chunks with a bounded carried state, optional ASCII case folding, and replace-all over a replacement list whose length is checked."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  Every row is `[]`: the automaton is built from a list of
# strings the caller holds and searched over a string the caller
# holds, and the streaming form takes its chunks as arguments rather
# than reading them.  Nothing here opens a file, reads a clock or
# allocates a buffer the caller did not ask for, so the package
# builds for a device and a test can drive a whole stream with no
# input at all.
layer       = "core"

category    = "text"

tags        = ["aho-corasick", "multi-pattern", "search", "automaton", "string-matching", "streaming", "text"]
repository  = "https://github.com/novolang/ahocorasick-nv"
maintainers = ["novo-lang"]
# 0.15.0 is the toolchain this release was built and tested with.
novo        = ">= 0.15.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Multi-pattern search with an automaton built once"

[dependencies]
# None, and that is a decision rather than an omission.  The obvious
# candidate is unicode-nv, for case folding — and it is refused:
# Unicode case folding is not length-preserving, so an automaton that
# folded could not report byte ranges into the caller's own haystack,
# which is the shape of every `AcMatch` this package answers.  The
# ASCII folding that IS offered needs no table.  regex-core-nv is the
# other neighbour, and the README says which of the two a caller
# wants.
